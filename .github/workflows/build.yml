name: Build
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0/4 * * *'

env:
  PYTHON_VERSION: '3.12.8'

jobs:
  Windows-build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: 版本对比
        run: |
          $head = (Invoke-WebRequest -Uri https://api.github.com/repos/naughtyGitCat/MoviePilot/git/refs/heads/v2-static | ConvertFrom-Json).object.sha
          echo "naughtyGitCat/MoviePilot@v2-static: $head"
          try {
            $latest = (Invoke-WebRequest -Uri https://api.github.com/repos/naughtyGitCat/Windows-MoviePilot/releases/latest | ConvertFrom-Json).tag_name
          } catch { $latest = "" }
          echo "最新 release: $latest"
          if ($latest -and $latest.Contains($head.Substring(0, 7))) {
            Write-Output "版本相同,无需更新"
            exit 1
          }
          Write-Output "检测到新 commit 执行打包"

      - name: pull build script
        uses: actions/checkout@v4
        with:
          path: 'Windows-MoviePilot'
          fetch-depth: 1

      - name: pull server code
        uses: actions/checkout@v4
        with:
          ref: v2-static
          repository: naughtyGitCat/MoviePilot
          path: 'MoviePilot'
          fetch-depth: 2

      - name: Init Python ${{ env.PYTHON_VERSION }} (build-time only)
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Download embeddable Python + install dependencies
        id: INSTALL_PACKAGES
        shell: powershell
        run: |
          # --- 1. 下载 Python embeddable (~25MB, 比完整安装小 ~90MB) ---
          $embedUrl = "https://www.python.org/ftp/python/$env:PYTHON_VERSION/python-$env:PYTHON_VERSION-embed-amd64.zip"
          Invoke-WebRequest $embedUrl -OutFile embed.zip
          New-Item -ItemType Directory Python3.11 | Out-Null
          Expand-Archive embed.zip -DestinationPath Python3.11
          Remove-Item embed.zip

          # --- 2. 启用 site-packages (默认 ._pth 中 `import site` 被注释掉) ---
          $pthFile = (Get-Item "Python3.11\python*._pth").FullName
          (Get-Content $pthFile) -replace '^#import site', 'import site' | Set-Content $pthFile

          # --- 3. 引导 pip ---
          Invoke-WebRequest "https://bootstrap.pypa.io/get-pip.py" -OutFile Python3.11\get-pip.py
          & .\Python3.11\python.exe .\Python3.11\get-pip.py --no-warn-script-location
          Remove-Item Python3.11\get-pip.py

          # --- 4. 拉取 MoviePilot-Resources 和版本信息 ---
          cd MoviePilot
          $hash_version=(git log -1 --pretty=format:"%h")
          $GIT_LOG=(git log -1 --oneline)
          echo "KEYM=$GIT_LOG" >> $env:GITHUB_OUTPUT
          echo "HASH_VERSION=$hash_version" >> $env:GITHUB_ENV
          cd app\helper
          Invoke-WebRequest -URI "https://raw.githubusercontent.com/jxxghp/MoviePilot-Resources/main/resources.v2/sites.cp312-win_amd64.pyd" -OutFile "sites.cp312-win_amd64.pyd"
          Invoke-WebRequest -URI "https://raw.githubusercontent.com/jxxghp/MoviePilot-Resources/main/resources.v2/user.sites.v2.bin" -OutFile "user.sites.v2.bin"
          cd ..\..\..

          # --- 5. 只装 MoviePilot 核心依赖 ---
          # 不预装任何插件 (及其依赖): MoviePilot 在 Web UI 启用插件时
          # 会自己从插件市场下载代码 + pip install requirements.txt
          # (见 app/startup/plugins_initializer.sync_plugins +
          #  app/core/plugin.install_plugin_missing_dependencies)
          # 这样可以把 400+ MB 的插件依赖 (playwright, spacy, googleapi...) 留给
          # 运行时按需安装, 显著减小安装包体积
          $python = (Resolve-Path ".\Python3.11\python.exe").Path
          & $python -m pip install --no-warn-script-location -r MoviePilot\requirements.txt

      - name: Download MoviePilot Frontend
        shell: powershell
        run: |
          $FRONTEND_VERSION = (Get-Content "./MoviePilot/version.py" | Select-String "FRONTEND_VERSION" | ForEach-Object { $_.ToString().Split('=')[1] }).Trim() -replace "'", "" -replace '"', ""
          $APP_VERSION = (Get-Content "./MoviePilot/version.py" | Select-String "APP_VERSION" | ForEach-Object { $_.ToString().Split('=')[1] }).Trim() -replace "'", "" -replace '"', ""
          New-Item -ItemType Directory MoviePilot-Frontend | Out-Null
          cd MoviePilot-Frontend
          Invoke-WebRequest -URI "https://github.com/jxxghp/MoviePilot-Frontend/releases/download/$FRONTEND_VERSION/dist.zip" -OutFile dist.zip
          Expand-Archive dist.zip -DestinationPath .
          Move-Item -Path .\dist\* -Destination . -Force
          Remove-Item -Path "dist.zip"
          Remove-Item -Path "dist" -Recurse
          cd ..
          $tagName = $APP_VERSION.Substring(1)
          echo "FIRST_VERSION=$tagName" >> $env:GITHUB_ENV
          echo "LATEST_VERSION=$tagName.$env:HASH_VERSION" >> $env:GITHUB_ENV

      - name: Slim down payload
        shell: powershell
        run: |
          function Report($path, $label) {
            if (Test-Path $path) {
              $mb = [math]::Round(((Get-ChildItem $path -Recurse -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1MB), 1)
              Write-Host "[${label}] $path = $mb MB"
            }
          }

          Report "Python3.11" "before"
          Report "MoviePilot-Frontend" "before"
          Report "MoviePilot" "before"

          # 1. 前端 source maps (vite 默认会发布 *.map, 生产环境用不到)
          Get-ChildItem MoviePilot-Frontend -Recurse -Filter "*.map" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue

          # 2. site-packages 精简 (tests / test / __pycache__ / .pyi)
          $sp = "Python3.11\Lib\site-packages"
          if (Test-Path $sp) {
            Get-ChildItem $sp -Recurse -Directory -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -in @('tests','test','__pycache__','docs','examples') } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
            Get-ChildItem $sp -Recurse -Include *.pyi -Force -ErrorAction SilentlyContinue |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }

          # 3. Python 根目录下的 __pycache__ (embeddable 初始无此目录, 保险起见清一遍)
          Get-ChildItem Python3.11 -Recurse -Filter __pycache__ -Directory -Force -ErrorAction SilentlyContinue |
            Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          Report "Python3.11" "after"
          Report "MoviePilot-Frontend" "after"

      - name: Compile Inno Setup Script
        shell: powershell
        run: |
          Invoke-WebRequest https://jrsoftware.org/download.php/is.exe?site=1 -OutFile is.exe
          Start-Process is.exe -ArgumentList "/VERYSILENT", "/NORETART", "/SP-","/SUPPRESSMSGBOXES","/DIR=C:\Users\runneradmin\AppData\Local\Temp\inno" -NoNewWindow -Wait
          Copy-Item -Path ".\Windows-MoviePilot\build\ChineseSimplified.isl" -Destination "C:\Users\runneradmin\AppData\Local\Temp\inno\Languages" -ErrorAction SilentlyContinue
          C:\Users\runneradmin\AppData\Local\Temp\inno\iscc "/DMyAppVersion=$env:LATEST_VERSION" .\Windows-MoviePilot\build\build.iss

      - name: Use current time
        shell: powershell
        run: |
          $shanghaiTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          echo "SHANGHAI_TIMEZONE=$($shanghaiTime.ToString('yyyyMMddHHmmss'))" >> $env:GITHUB_ENV

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.FIRST_VERSION }}.${{ env.SHANGHAI_TIMEZONE }}.${{ env.HASH_VERSION }}
          tag_name: ${{ env.FIRST_VERSION }}.${{ env.HASH_VERSION }}
          body: ${{ steps.INSTALL_PACKAGES.outputs.KEYM }}
          draft: false
          prerelease: false
          make_latest: true
          files: .\Windows-MoviePilot\build\exe\*.exe
