name: Fix Build (force rebuild)
on:
  workflow_dispatch:

jobs:
  Windows-build:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - name: pull build script
        uses: actions/checkout@v4
        with:
          path: 'Windows-MoviePilot'
          fetch-depth: 1

      - name: pull server code
        uses: actions/checkout@v4
        with:
          ref: v2-static
          repository: naughtyGitCat/MoviePilot
          path: 'MoviePilot'
          fetch-depth: 2

      - name: Init Python 3.12.8
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.8'
          cache: 'pip'

      - name: Install dependent packages
        id: INSTALL_PACKAGES
        run: |
          cd MoviePilot
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          $hash_version=(git log -1 --pretty=format:"%h")
          $GIT_LOG=(git log -1 --oneline)
          echo "KEYM=$GIT_LOG" >> $env:GITHUB_OUTPUT
          echo "HASH_VERSION=$hash_version" >> $env:GITHUB_ENV
          cd app/helper
          Invoke-WebRequest -URI "https://raw.githubusercontent.com/jxxghp/MoviePilot-Resources/main/resources.v2/sites.cp312-win_amd64.pyd" -OutFile "sites.cp312-win_amd64.pyd"
          Invoke-WebRequest -URI "https://raw.githubusercontent.com/jxxghp/MoviePilot-Resources/main/resources.v2/user.sites.v2.bin" -OutFile "user.sites.v2.bin"
          cd ../plugins/
          Invoke-WebRequest -Uri "https://github.com/jxxghp/MoviePilot-Plugins/archive/refs/heads/main.zip" -OutFile "MoviePilot-Plugins-main.zip"
          Expand-Archive -Path "MoviePilot-Plugins-main.zip" -DestinationPath "MoviePilot-Plugins-main"
          Move-Item -Path "MoviePilot-Plugins-main/MoviePilot-Plugins-main/plugins.v2/*" -Destination . -Force
          Remove-Item "clashruleprovider" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "MoviePilot-Plugins-main.zip"
          Remove-Item -Path "MoviePilot-Plugins-main" -Recurse -Force
          Get-ChildItem -Path . -Recurse -Filter "requirements.txt" | ForEach-Object { pip install -r $_ }

      - name: Download MoviePilot Frontend
        run: |
          $FRONTEND_VERSION = (Get-Content "./MoviePilot/version.py" | Select-String "FRONTEND_VERSION" | ForEach-Object { $_.ToString().Split('=')[1] }).Trim() -replace "'", "" -replace '"', ""
          $APP_VERSION = (Get-Content "./MoviePilot/version.py" | Select-String "APP_VERSION" | ForEach-Object { $_.ToString().Split('=')[1] }).Trim() -replace "'", "" -replace '"', ""
          mkdir MoviePilot-Frontend
          cd MoviePilot-Frontend
          Invoke-WebRequest -URI "https://github.com/jxxghp/MoviePilot-Frontend/releases/download/$FRONTEND_VERSION/dist.zip" -OutFile dist.zip
          Expand-Archive dist.zip -DestinationPath .
          Move-Item -Path .\dist\* -Destination . -Force
          Remove-Item -Path "dist.zip"
          Remove-Item -Path "dist" -Recurse
          $tagName = $APP_VERSION.Substring(1)
          echo "FIRST_VERSION=$tagName" >> $env:GITHUB_ENV
          echo "LATEST_VERSION=$tagName.$env:HASH_VERSION" >> $env:GITHUB_ENV

      - name: Make Python package
        run: |
          $python_dir=$(python -c "import os; print(os.path.dirname(os.__file__))")
          $python_root_dir=$python_dir.Substring(0, $python_dir.Length - 4)
          mkdir Python3.11
          cd Python3.11
          cp -r $python_root_dir/* .

      - name: Compile Inno Setup Script
        run: |
          Invoke-WebRequest https://jrsoftware.org/download.php/is.exe?site=1 -OutFile is.exe
          Start-Process is.exe -ArgumentList "/VERYSILENT", "/NORETART", "/SP-","/SUPPRESSMSGBOXES","/DIR=C:\Users\runneradmin\AppData\Local\Temp\inno" -NoNewWindow -Wait
          Copy-Item -Path ".\Windows-MoviePilot\build\ChineseSimplified.isl" -Destination "C:\Users\runneradmin\AppData\Local\Temp\inno\Languages" -ErrorAction SilentlyContinue
          C:\Users\runneradmin\AppData\Local\Temp\inno\iscc "/DMyAppVersion=$env:LATEST_VERSION" .\Windows-MoviePilot\build\build.iss

      - name: Use current time
        run: |
          $shanghaiTime = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), [System.TimeZoneInfo]::FindSystemTimeZoneById("China Standard Time"))
          echo "SHANGHAI_TIMEZONE=$($shanghaiTime.ToString('yyyyMMddHHmmss'))" >> $env:GITHUB_ENV

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.FIRST_VERSION }}.${{ env.SHANGHAI_TIMEZONE }}.${{ env.HASH_VERSION }}
          tag_name: ${{ env.FIRST_VERSION }}.${{ env.HASH_VERSION }}
          body: ${{ steps.INSTALL_PACKAGES.outputs.KEYM }}
          draft: false
          prerelease: false
          make_latest: true
          files: .\Windows-MoviePilot\build\exe\*.exe
